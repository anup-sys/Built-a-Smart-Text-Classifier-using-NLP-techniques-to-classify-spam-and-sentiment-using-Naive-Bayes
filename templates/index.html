<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Spam Classifier</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(120deg, #1e3c72, #2a5298);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card {
        background: #ffffff;
        width: 420px;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        text-align: center;
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    h1 {
        color: #1e3c72;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
    }

    textarea {
        width: 100%;
        height: 100px;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #ccc;
        resize: none;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
    }

    textarea:focus {
        border-color: #2a5298;
        box-shadow: 0 0 8px rgba(42,82,152,0.3);
    }

    button {
        margin-top: 15px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #2a5298;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #1e3c72;
    }

    .result-box {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        animation: fadeIn 0.5s ease;
    }

    .spam {
        background: #ffe5e5;
        color: #d8000c;
        border: 1px solid #d8000c;
    }

    .ham {
        background: #e6ffed;
        color: #007e33;
        border: 1px solid #007e33;
    }

    .confidence {
        font-size: 13px;
        margin-top: 5px;
        color: #555;
    }
</style>
</head>

<body>

<div class="card">
    <h1>📩 Spam Detector</h1>
    <p class="subtitle">AI-powered message classification</p>

    <form action="/predict" method="post">
        <textarea name="message" placeholder="Type your message here..." required></textarea>
        <button type="submit">Check Message</button>
    </form>

    {% if prediction %}
        <div class="result-box {{ 'spam' if prediction == 'Spam' else 'ham' }}">
            {{ prediction }}
            {% if confidence %}
                <div class="confidence">Confidence: {{ confidence }}%</div>
            {% endif %}
        </div>
    {% endif %}
</div>

</body>
</html>
